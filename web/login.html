<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TapIn - Login</title>
<link rel="icon" type="image/png" href="assets/tapin_icon.png">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <main class="login-wrap">
    <!-- Logos outside the login card - positioned at top left of the page -->
    <div class="top-logos-container">
      <img src="./assets/ispsc_logo.png" alt="ISPSC Logo" class="top-logo">
      <img src="./assets/bagong_pilipinas_logo.png" alt="Bagong Philipinas Logo" class="top-logo">
    </div>

    <div class="login-card">

      <div class="logo-area">
          <p class="eyebrow">TAPIN · ISPSC TAGUDIN</p>
          <h1>RFID Attendance System</h1>
          <p class="subtitle">Sign in to manage attendance securely.</p>
      </div>

      <form id="loginForm" novalidate>

        <label class="field">
          <span class="field-label">Username</span>
          <input type="text" name="username" id="username" placeholder="Enter your username" autocomplete="username" required>
        </label>

        <label class="field">
          <span class="field-label">Password</span>
          <span class="password-wrap">
            <input type="password" name="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password" title="Show password"><i class="fa-solid fa-eye" aria-hidden="true"></i></button>
          </span>
        </label>

        <div class="row-between">
          <label class="checkbox">
            <input type="checkbox" name="remember">
            <span>Remember me</span>
          </label>
          <a href="#" class="link-muted">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary"><span class="button-label">Sign In</span><span class="button-loading" aria-hidden="true">Signing in...</span></button>

        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>

      </form>

      <p class="footnote">
        Having trouble logging in? Contact your system administrator.
      </p>

    </div>
  </main>

<!-- Local JS -->
<script src="js/login.js"></script>
</body>
</html>
