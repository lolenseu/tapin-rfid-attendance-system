<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TapIn - Profile</title>
    <link rel="icon" type="image/png" href="assets/tapin_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/profile.css" />
</head>
<body>

<div class="profile-wrap">
    <!-- Logos outside the profile card - positioned at top left of the page -->
    <div class="top-logos-container">
        <img src="./assets/ispsc_logo.png" alt="ISPSC Logo" class="top-logo">
        <img src="./assets/bagong_pilipinas_logo.png" alt="Bagong Philipinas Logo" class="top-logo">
    </div>

    <div class="container" id="app">
        <div class="header">
            <div class="logo" id="logoContainer">
                <img src="assets/tapin_logo.png" alt="TapIn Logo" onerror="this.style.display='none';this.parentElement.innerHTML='<span class=\'logo-placeholder\'>T</span>';" />
            </div>
            <h1>TapIn Profile</h1>
        </div>

        <div class="status-bar">
            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Connecting...</span>
            </div>
            <span class="time" id="lastUpdated">--</span>
        </div>

        <div class="scanned-display">
            <div class="scanned-at" id="scannedAt">Waiting for scan...</div>
        </div>

        <div class="employee-card" id="employeeCard"></div>

        <div class="no-data" id="noData">
            <div class="empty-avatar" id="emptyAvatar">
                <img src="assets/profile_icon.png" alt="Profile" id="profileIconPlaceholder" />
            </div>
            <h3>Unknown</h3>
            <p>Tap an RFID card to see employee profile</p>
        </div>

        <div class="footer">
            TapIn Attendance System &bull; ISPSC Tagudin Campus
        </div>
    </div>
</div>

<script src="js/profile.js"></script>
</body>
</html>
